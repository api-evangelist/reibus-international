name: Reibus International
description: >-
  Reibus International is an Atlanta, Georgia headquartered technology company operating a
  digital marketplace and open-deck freight logistics platform for the industrial metals
  industry. Reibus connects buyers and sellers of steel and other industrial metals with a
  curated network of international and domestic carriers, offering instant freight quotes,
  automated carrier assignment, and real-time shipment visibility tracking. The Reibus
  Logistics platform specializes in flatbed, dry van, and dray transportation across the
  contiguous United States, Canada, and Mexico, plus specialized services including oversized
  loads, team drivers, expedited shipping, cross-border logistics, high-value freight, and
  warehousing. Founded by CEO John Blount, Reibus operates across seven countries with
  business relationships spanning more than 25 nations and is backed by Battery Ventures.
  Reibus does not currently publish a public developer API, OpenAPI specification, or
  developer portal; customer-facing tools (instant quote, shipment visibility dashboard) are
  delivered through the app.reibus.com web application.
